name: Scaffold CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-smoke-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Smoke test
        run: ./build/enterprise128_scaffold
